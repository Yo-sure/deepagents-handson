[project]
name = "agent-workshop"
version = "2026.9.0"
description = "개인 실습용 AI Agent 개발 과정"
requires-python = ">=3.12"
dependencies = [
  "langchain[mcp]==1.4.0",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "deepagents==0.7.13",
  "mcp==2.1.1",
  "a2a-sdk[http-server]==1.1.2",
  "httpx>=0.28",
  "uvicorn>=0.34",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
