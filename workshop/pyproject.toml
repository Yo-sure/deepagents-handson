[project]
name = "agent-workshop"
version = "2026.9.0"
description = "개인 실습용 AI Agent 개발 과정"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.3.9",
  "langchain-openai>=1.3.2",
  "langgraph>=1.2.5",
  "deepagents>=0.7.0",
  "mcp>=2.0.0",
  "a2a-sdk[http-server]>=1.1.0",
  "httpx>=0.28",
  "uvicorn>=0.34",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
